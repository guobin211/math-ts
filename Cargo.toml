[workspace]
members = ["packages/math-ts-core", "packages/math-ts-wasm", "packages/math-ts-napi"]
resolver = "2"

[profile.release]
lto = true
opt-level = "s"
strip = "symbols"

[workspace.dependencies]
serde = { version = "~1.0.188", features = ["derive"] }
serde_json = "~1.0.107"
lazy_static = "~1.4.0"
log = "~0.4.19"
env_logger = "0.11.1"
